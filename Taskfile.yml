# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

vars:
  aws_region:
    sh: aws configure get region

tasks:
  variables:
    desc: Display the current variables
    cmds:
      - 'echo "aws_region: {{.aws_region}}"'
    silent: true

  validate:
    desc: Validate the Terraform configuration
    cmds:
      - cd infrastructure && terraform fmt -check -recursive -diff
    silent: true

  init:
    desc: Perform initialization tasks
    cmds:
      - cd infrastructure && terraform init
    silent: true

  plan:
    desc: Generate and show an execution plan
    deps:
      - init
    cmds:
      - |
        cd infrastructure && terraform plan --var="aws_region={{.aws_region}}"
    silent: true

  apply:
    desc: Apply the changes required to reach the desired state of the configuration
    deps:
      - init
    cmds:
      - cd infrastructure && terraform apply --var="aws_region={{.aws_region}}"
    silent: true

  destroy:
    desc: Destroy the Terraform-managed infrastructure
    deps:
      - init
    cmds:
      - cd infrastructure && terraform plan -destroy --var="aws_region={{.aws_region}}"
      - cd infrastructure && terraform apply -destroy --var="aws_region={{.aws_region}}"
    silent: true